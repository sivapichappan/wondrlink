# Connection-map concept vocabulary — breast pilot (SPEC-connection-map.md §10.1).
#
# Reviewable clinical config, following the safety-rules precedent. Nothing here
# reaches a patient: display_patient is null on every row and is filled in by the
# attesting physician during review (§5.4 "Reword"), because plain-language
# wording is a clinical judgment, not something this pipeline invents.
#
# Two kinds of row:
#   - the 53 concepts listed verbatim in spec §10.1
#   - 7 rows marked `spec_addition: true` — concepts the spec's own extraction
#     targets (§10.2-§10.4) reference but omitted from §10.1. Without them those
#     targets are inexpressible, since pass 1 rejects any concept absent from
#     this table. Marked so the reviewer sees exactly what was added and why.
#     (§10.2's separate "hair loss" and "hair thinning" rows need no addition:
#     both map to §10.1's single "hair loss or thinning".)
#
# instrument reflects how the value is actually captured in Sage today:
# report_scan = pathology/report OCR, ehr_field = structured profile field,
# lab = numeric result, pro_instrument = a validated screener already in the
# app (PHQ-9, GAD-7, ISI), self_report_chat = the patient says so in chat.

