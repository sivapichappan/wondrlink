# Connection-map source corpus — breast pilot (SPEC-connection-map.md §4.2).
#
# Ingested by scripts/ingest_connection_map_corpus.py into source_document /
# source_section, VERBATIM. This is a separate corpus from the RAG one
# (pdf_documents/pdf_chunks): the same PDFs, stored unmodified, because every
# citation is verified character for character.
#
# scope is load-bearing. §4.2: "Symptom-cluster relationships live mostly in
# general survivorship sources. A breast-only corpus will underproduce
# candidates. Ingest both." The review workspace labels each quotation with
# its scope so the physician can see which corpus a claim came from.
#
# KNOWN GAP, worth naming before extraction runs: the general survivorship set
# below is caregiver, stress, and sleep material. There is no survivorship
# care plan, late-effects, or exercise/nutrition guideline in data/ that is not
# colorectal-specific. §10.3's co-occurrence targets (the psychoneurological
# symptom cluster) will underproduce until such a source is added. That is a
# corpus acquisition task, not a code change.
#
# file paths are relative to data/. Titles and publishers come from
# data/_filename_to_metadata.yaml plus each document's cover page.

